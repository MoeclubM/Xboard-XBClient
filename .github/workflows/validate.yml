name: Validate plugin
on:
  push:
    branches: ['codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      CACHE_STORE: array
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MoeclubM/Xboard
          ref: codex/sudoku-support
      - uses: actions/checkout@v4
        with:
          path: plugins/Xbclient
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, redis, bcmath, pcntl, gd, zip
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: find plugins/Xbclient -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: vendor/bin/phpunit --bootstrap vendor/autoload.php plugins/Xbclient/Tests
