name: Validate plugin
on:
  push:
    branches: ['main', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        xboard: ['MoeclubM/Xboard', 'cedar2025/Xboard']
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testing
          MYSQL_DATABASE: xboard_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -ptesting" --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_DATABASE: xboard_test
      DB_USERNAME: root
      DB_PASSWORD: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      CACHE_STORE: array
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.xboard }}
          ref: master
      - uses: actions/checkout@v4
        with:
          path: plugins/Xbclient
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, redis, bcmath, pcntl, gd, zip
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: find plugins/Xbclient -name '*.php' -print0 | xargs -0 -n1 php -l
      - if: matrix.xboard == 'MoeclubM/Xboard'
        run: vendor/bin/phpunit --bootstrap vendor/autoload.php plugins/Xbclient/Tests
      - uses: actions/checkout@v4
        with:
          repository: MoeclubM/NodeRS
          ref: v0.1.47
          path: .interop/noders
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare real NodeRS and Mihomo clients
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install pyyaml
          mkdir -p .interop/bin
          gh release download v0.1.47 --repo MoeclubM/NodeRS --pattern noders-v0.1.47-linux-amd64.tar.gz --dir .interop/bin
          tar -xzf .interop/bin/noders-v0.1.47-linux-amd64.tar.gz -C .interop/bin
          gh release download --repo MetaCubeX/mihomo --pattern 'mihomo-linux-amd64-v1-v*.gz' --dir .interop/bin
          gzip -dc .interop/bin/mihomo-linux-amd64-v1-v*.gz > .interop/bin/mihomo
          chmod +x .interop/bin/mihomo
      - name: Verify stock subscriptions through NodeRS with TCP and UDP
        run: python plugins/Xbclient/Tests/ss2022_interop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ss2022-${{ strategy.job-index }}
          path: .interop/results
